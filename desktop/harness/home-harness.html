<!doctype html>
<!--
  Draft home window harness (FEAT-0160 / TASK-0648).

  Loads the REAL built page (dist/renderer/home.js, home-model.js, home.css
  and base.css) in a plain browser, with the preload bridge stubbed. The
  page is pure DOM composition over two payloads, and the only other way to
  see it is to restart the cockpit and open File, Home (draft).

  Build first (npm run build), then serve the repo root over http and open:
    /desktop/harness/home-harness.html          → light
    /desktop/harness/home-harness.html#dark     → dark
    /desktop/harness/home-harness.html#empty    → nothing owed, nothing open

  The fixtures are shaped like the sidecar's landing, stats and release
  payloads and the shell's fleet rows. They cover what the page has to get
  right: commits that collapse to one row, a project with no sidecar, a
  phase with nothing in progress, a release in preparation, and every agent
  word. `window.__opened` records what a click asked the present window to
  open.
-->
