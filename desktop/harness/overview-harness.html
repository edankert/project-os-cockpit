const RENDERED = {"decisions/ADR-0007-Planning-Artifact-Approval-Gate.md": {"metadata_html": "<details class=\"metadata-strip\" open>\n  <summary class=\"metadata-strip-summary\"><span class=\"metadata-strip-chevron\" aria-hidden=\"true\"></span><span>Frontmatter</span></summary>\n  <dl>\n  <dt>id</dt>\n  <dd><a href=\"/docs/decisions/ADR-0007-Planning-Artifact-Approval-Gate.md\">ADR-0007</a></dd>\n  <dt>type</dt>\n  <dd><a href=\"/docs/__templates__/adr.md\">adr</a></dd>\n  <dt>status</dt>\n  <dd><span class=\"status-chip\" data-status=\"proposed\">proposed</span></dd>\n  <dt>owner</dt>\n  <dd>user:edwin</dd>\n  <dt>related</dt>\n  <dd><span class=\"meta-list\"><a href=\"/docs/features/review-desk/FEAT-0041-Review-Desk.md\">FEAT-0041-Review-Desk</a>, <a href=\"/docs/features/review-desk/plan/tasks/TASK-0205-Approval-Gate-Decision.md\">TASK-0205</a>, <a href=\"/docs/features/dispatch-runtime/FEAT-0025-Dispatch-Runtime.md\">FEAT-0025-Dispatch-Runtime</a>, <a href=\"/docs/decisions/ADR-0006-Retire-Delivered-Band.md\">ADR-0006-Retire-Delivered-Band</a></span></dd>\n  <dt>source</dt>\n  <dd><span class=\"meta-list\">https://claude.ai/code/artifact/3e6b4313-66e9-4fca-b11b-97c3d7a1d1be</span></dd>\n  <dt>created</dt>\n  <dd>2026-07-26</dd>\n  <dt>updated</dt>\n  <dd>2026-07-26</dd>\n  <dt>decision</dt>\n  <dd>Adopt an advisory review flow first: every planning artifact set the agent produces is reviewable in ~review, nothing is blocked on acceptance, and the desk records how often review actually changes a plan. The mechanism introduces no new states: FEAT/TASK proposal sets enter the queue as dispatch-ledger review requests while their notes stay at plain `backlog`; accepting a set stamps the existing independent-review frontmatter (`reviewed_by`, `review_date`, `review_verdict`) into each note and clears the ledger request; rejecting flips the set to the existing `cancelled` status; ADR/REQ/TST queue groups use their existing intake states (`proposed`/`draft`/`ready`). Only after measurement decide whether to promote the gate to gated-by-type \u2014 and if so, the gate predicate is &#x27;has an accepting review_verdict&#x27;, not a status check.</dd>\n  <dt>context</dt>\n  <dd>Today LIFECYCLE lets preflight create planning artifacts and proceed straight to implementation; the review desk (FEAT-0041) introduces a surface where a human can accept, amend, or reject a proposal set before work starts. Making review a hard gate \u2014 dispatch refusing a set that has not been accepted \u2014 would be a lifecycle change, and the fleet&#x27;s own history (ADR-0006: a band nobody ever wrote; upstream ADR-0008: statuses measured before deletion) argues for measuring before legislating. The queue/record split follows ADR-0009 and the REQ-0018 attention model: pending-ness is transient runtime state (the dispatch ledger), the durable outcome lives in the note (review fields, or a real status transition)</dd>\n  <dt>alternatives</dt>\n  <dd><span class=\"meta-list\">Introduce `proposed` for feature/task vocabularies (the dossier&#x27;s original sketch) \u2014 rejected 2026-07-26, owner preference: no new states; the dispatch ledger + existing review fields cover both the queue (transient pending-ness) and the record (durable outcome) without touching STATUSES/TAXONOMY or the upstream template, Gated by type from day one \u2014 FEAT / REQ / ADR require acceptance before dispatch; TASK breakdowns under an accepted FEAT auto-accept. Rejected for now: adds a human bottleneck to every feature before any evidence that review changes outcomes; revisit with the advisory-phase measurements in hand, Fully gated \u2014 every planning artifact requires acceptance. Rejected: turns the docs system&#x27;s strength (agents keep documentation current without friction) into a queue, and contradicts the bursty session pattern the states audit documents, No review surface at all (status quo) \u2014 rejected: the asks already exist (proposal sets, questions, never-executed manual tests like TST-0011) and currently live in terminal scrollback where they decay</span></dd>\n  <dt>consequences</dt>\n  <dd><span class=\"meta-list\">No LIFECYCLE change is needed for the advisory phase, and no vocabulary change anywhere: notes stay on their existing statuses, so STATUSES.md/TAXONOMY.md and the upstream template are untouched, The split is ADR-0009-clean: the ledger carries the transient review request (runtime state, like REQ-0018 attention items), the note carries the durable outcome \u2014 stamped review fields on accept, a statuses.py-guarded flip to `cancelled` on reject; snapshot sync at pre-commit is unchanged, The write mechanism is a review write-back endpoint (TASK-0207) \u2014 a deliberate, narrow relaxation of the &#x27;cockpit is a viewer&#x27; constraint (PHASE-007 out-of-scope list), extending the TASK-0074 checkbox precedent: it writes only the three review fields and guarded status transitions, nothing else, If gating is later adopted, dispatch&#x27;s gate predicate is &#x27;set has an accepting review_verdict&#x27; \u2014 a frontmatter check, not a status check, so gating still introduces no vocabulary, The review fields do double duty: today they record close-out independent review (e.g. FEAT-0023), now also plan acceptance. The desk must not let a plan-acceptance stamp satisfy the close-out review gate \u2014 distinguish by verdict value (decide the exact value in TASK-0207), The advisory phase must actually measure: the desk records per-set outcomes (accepted unchanged / accepted amended / changes requested / rejected) so the gating decision is evidence-based, the same lesson ADR-0006 codified</span></dd>\n</dl>\n</details>\n", "html": "<h1 id=\"approval-gate-for-planning-artifacts\">Approval gate for planning artifacts</h1>\n<h2 id=\"context\">Context</h2>\n<p>The project-os lifecycle currently has no human checkpoint between planning and implementation: preflight classifies, allocates IDs, writes the notes, and the agent proceeds. That is by design \u2014 the system's value is that documentation keeps up with the work \u2014 but it means the moments where a human <em>should</em> weigh in (a new feature's shape, a requirement's acceptance criteria, a decision like this one) have no surface. FEAT-0041 builds that surface (~review). What it must not do silently is change the lifecycle's default: whether an unaccepted proposal set may be implemented at all.</p>\n<p>Two defensible shapes exist for the policy. <strong>Advisory:</strong> everything is reviewable, nothing is blocked \u2014 the desk is a lens, and acceptance is a recorded opinion. <strong>Gated by type:</strong> FEAT / REQ / ADR require acceptance before dispatch; TASK breakdowns under an already-accepted FEAT auto-accept, so day-to-day flow keeps its speed.</p>\n<p>Orthogonal to the policy is the mechanism, and there the owner's constraint is fixed (2026-07-26): <strong>no new states, anywhere.</strong> Pending-ness is not note state \u2014 the same philosophy as REQ-0018's attention items, which live in the runtime, not in frontmatter.</p>\n<h2 id=\"decision\">Decision</h2>\n<p>Start advisory, with a stateless-queue mechanism:</p>\n<ul>\n<li><strong>Queue:</strong> FEAT/TASK proposal sets enter ~review as <strong>dispatch-ledger review requests</strong> (FEAT-0025 runtime); the notes themselves stay at plain <code>backlog</code>. ADR, REQ, and TST queue groups are driven by their existing intake states (<code>proposed</code>, <code>draft</code>, <code>ready</code>).</li>\n<li><strong>Accept:</strong> stamps the existing independent-review convention \u2014 <code>reviewed_by</code>, <code>review_date</code>, <code>review_verdict</code> \u2014 into each note in the set and clears the ledger request. Durable outcome in the note, transient queue in the runtime (ADR-0009-clean).</li>\n<li><strong>Reject:</strong> flips the set to the existing <code>cancelled</code> status through a statuses.py-guarded transition.</li>\n<li><strong>Request changes:</strong> a dispatch round-trip back to the originating session (comment + unticked rows), leaving the ledger request open.</li>\n</ul>\n<p>Nothing refuses to run for lack of acceptance. The desk records review outcomes per set. After a measurement period (suggested: revisit when ~20 sets have passed through the desk, or at the PHASE-008 close-out \u2014 whichever is later), decide gating with data: if review regularly changes plans before implementation, promote to gated-by-type \u2014 where the gate predicate is \"set has an accepting <code>review_verdict</code>\", a frontmatter check, never a status check. If it rubber-stamps, stay advisory and say so here.</p>\n<p>This mirrors the fleet's best recent lesson (ADR-0006 / upstream ADR-0008): vocabulary and process should follow what the corpus actually does, measured, not what a design wishes it did.</p>\n<h2 id=\"alternatives\">Alternatives</h2>\n<p>See frontmatter \u2014 introducing <code>proposed</code> for features/tasks (rejected: owner preference, no new states; ledger + existing review fields cover both queue and record), gated-by-type from day one, fully gated, and status quo, with rejection reasons.</p>\n<h2 id=\"verdict-values-recorded-from-task-0207-2026-07-26\">Verdict values (recorded from TASK-0207, 2026-07-26)</h2>\n<p>The desk writes <strong><code>plan-accepted</code></strong> on acceptance and <strong><code>plan-rejected</code></strong> on rejection. Neither is close-out's vocabulary (<code>approved</code> / <code>changes-requested</code>, QUALITY.md), and the write-back endpoint refuses those strings outright, so a plan approval can never read as a verification sign-off.</p>\n<p>Refusing the string turned out to be only half the guard. Independent review (2026-07-26) observed that the mechanical close-out check accepts <em>any</em> verdict other than <code>changes-requested</code>, so a <code>plan-accepted</code> stamp landing on a TST or CHG note would silence a gate it never satisfied \u2014 and review requests accept arbitrary ids. The endpoint therefore also refuses to stamp <strong>gate-bearing note types</strong> (<code>test</code>, <code>change</code>) at all: those are reviewed through close-out, not through the desk. Both guards are asserted in <a href=\"/docs/features/review-desk/plan/tests/TST-0021-Review-Desk.md\">TST-0021-Review-Desk</a>.</p>\n<h2 id=\"consequences\">Consequences</h2>\n<p>See frontmatter. The two that need active tracking: the review-field double duty (plan acceptance vs close-out independent review share <code>reviewed_by</code>/<code>review_date</code>/<code>review_verdict</code> \u2014 the desk must distinguish by verdict value so a plan-acceptance stamp never satisfies the close-out gate; exact value decided in TASK-0207), and the measurement obligation (the advisory phase is an experiment, not a resting place; TASK-0205 carries the decision, and the revisit is part of PHASE-008's close-out).</p>"}, "requirements/REQ-0022-Overview-State-Above-History.md": {"metadata_html": "<details class=\"metadata-strip\" open>\n  <summary class=\"metadata-strip-summary\"><span class=\"metadata-strip-chevron\" aria-hidden=\"true\"></span><span>Frontmatter</span></summary>\n  <dl>\n  <dt>id</dt>\n  <dd><a href=\"/docs/requirements/REQ-0022-Overview-State-Above-History.md\">REQ-0022</a></dd>\n  <dt>type</dt>\n  <dd><a href=\"/docs/__templates__/requirement.md\">requirement</a></dd>\n  <dt>status</dt>\n  <dd><span class=\"status-chip\" data-status=\"implemented\">implemented</span></dd>\n  <dt>phase</dt>\n  <dd><a href=\"/docs/phases/PHASE-008-State-And-Review-Surfaces.md\">PHASE-008-State-And-Review-Surfaces</a></dd>\n  <dt>owner</dt>\n  <dd>user:edwin</dd>\n  <dt>implements</dt>\n  <dd><a href=\"/docs/features/overview-rework/FEAT-0040-Overview-Rework.md\">FEAT-0040-Overview-Rework</a></dd>\n  <dt>related</dt>\n  <dd><span class=\"meta-list\"><a href=\"/docs/requirements/REQ-0013-Cockpit-Layout.md\">REQ-0013-Cockpit-Layout</a>, <a href=\"/docs/requirements/REQ-0012-Visual-Style.md\">REQ-0012-Visual-Style</a>, <a href=\"/docs/decisions/ADR-0006-Retire-Delivered-Band.md\">ADR-0006-Retire-Delivered-Band</a></span></dd>\n  <dt>source</dt>\n  <dd><span class=\"meta-list\">https://claude.ai/code/artifact/3e6b4313-66e9-4fca-b11b-97c3d7a1d1be</span></dd>\n  <dt>created</dt>\n  <dd>2026-07-26</dd>\n  <dt>updated</dt>\n  <dd>2026-07-26</dd>\n  <dt>priority</dt>\n  <dd>high</dd>\n  <dt>scope</dt>\n  <dd><a href=\"/docs/features/overview-rework/FEAT-0040-Overview-Rework.md\">FEAT-0040</a></dd>\n  <dt>acceptance</dt>\n  <dd><span class=\"meta-list\">state-only above the fold at 900px, requirements tile rendered, quiet state fully designed, history never outranks state on any overview scope</span></dd>\n</dl>\n</details>\n", "html": "<h1 id=\"req-0022-overview-state-above-history\">REQ-0022 \u2014 Overview state above history</h1>\n<h2 id=\"statement\">Statement</h2>\n<p>The overview surfaces (~overview and ~overview/PHASE-####) SHALL prioritise current project state over historical record: every section rendered above the fold in a 900 px window states what <em>is</em> (focus, status mixes, phase liveness, items waiting on the user), and historical sections (activity chart, commits/changes feeds) are the only content the user must scroll for. State surfaces must be honest about quiet: when nothing is in flight, the screens show the audited resting state (last-completed focus with note age, durable attention items, \"All clear\" when empty) rather than empty live-state placeholders.</p>\n<h2 id=\"acceptance-criteria\">Acceptance Criteria</h2>\n<ul class=\"task-list\">\n<li class=\"task-list-item\"><label class=\"task-list-control\"><input type=\"checkbox\" disabled checked/><span class=\"task-list-indicator\"></span></label> In a 900 px window on this repo's corpus, every ~overview section above the fold (focus band, stat tiles, phase rows, Waiting-on-you) presents current-state facts; the activity sparkbar and commits panel are the only sections that may begin below the fold. \u2014 evidence: measured 2026-07-26 in <code>desktop/harness/overview-harness.html</code> against the built bundle (stage offsets, phase accordion expanded, 8 Waiting-on-you rows): focus band 20\u201367 px, stat tiles 85\u2013173, phases 191\u2013556, Waiting-on-you 574\u2013721 \u2014 the four state sections close at 721 px, inside a 900 px stage. Activity begins at 739 and Commits at 867, so the two history sections are the only ones that can reach the fold, and neither precedes any state section. Note the honest nuance: with a very long phase list Activity can still appear above the fold \u2014 what is guaranteed is the ordering (criterion 4), not that history always falls below it.</li>\n<li class=\"task-list-item\"><label class=\"task-list-control\"><input type=\"checkbox\" disabled checked/><span class=\"task-list-indicator\"></span></label> The Requirements stat tile renders from <code>hero.requirements</code> (computed by <code>stats_payload</code> today but never rendered by <code>buildHero</code>). \u2014 evidence: <code>desktop/src/renderer/renderer.ts</code> <code>buildStatTiles()</code> emits the Reqs tile from <code>hero.requirements</code>; visible as \"REQS 21/22\" in the harness capture.</li>\n<li class=\"task-list-item\"><label class=\"task-list-control\"><input type=\"checkbox\" disabled checked/><span class=\"task-list-indicator\"></span></label> The quiet (no live session) state is fully designed: the focus band reads as \"last completed\" with the focus note's age; Waiting-on-you lists only durable states the corpus actually holds (open issues, in-review stalls, ready-never-executed tests, parked tasks, open risks, done-but-unclosed phases) and renders \"All clear\" when empty. \u2014 evidence: <code>buildFocusBand()</code> adds the pulse/NOW label only when a slot is genuinely active and always renders the note's age (<code>daysSince</code>); the empty case renders \"All clear \u2014 nothing is blocked on a human.\" <strong>Corrected after independent review (2026-07-26):</strong> the first implementation put all six states in <code>collectAttention()</code>, but the phases payload carries no test items (<code>child_records</code> is tasks/requirements/issues), so the failing-test and ready-test branches were unreachable \u2014 two of the six states could never appear. Tests are now sourced separately in <code>appendTestAttentionRows()</code> and the dead branches were removed; the other four states come from <code>collectAttention()</code> as before.</li>\n<li class=\"task-list-item\"><label class=\"task-list-control\"><input type=\"checkbox\" disabled checked/><span class=\"task-list-indicator\"></span></label> On both overview scopes, no history surface (activity, commits, recent feeds) renders above a state surface. \u2014 evidence: <code>renderProjectOverview()</code> composes focus \u2192 tiles \u2192 phases \u2192 Waiting-on-you \u2192 activity \u2192 commits, and <code>renderScopedOverview()</code> composes header \u2192 health band \u2192 features \u2192 exit criteria/Remaining \u2192 activity; the note feed and donut section were removed rather than relocated.</li>\n</ul>\n<h2 id=\"traceability\">Traceability</h2>\n<ul>\n<li>Implements: <a href=\"/docs/features/overview-rework/FEAT-0040-Overview-Rework.md\">FEAT-0040-Overview-Rework</a></li>\n<li>Verified by: to be defined at implementation (TST-* per test-authoring; the fold criterion is a manual/CDP check, the tile and ordering criteria are unit-checkable).</li>\n</ul>"}};

// ---- stub the sidecar --------------------------------------------------
const realFetch = window.fetch.bind(window);
window.fetch = async (input, init) => {
  const url = String(typeof input === 'string' ? input : input.url);
  const json = (body) => new Response(JSON.stringify(body), {
    status: 200, headers: { 'Content-Type': 'application/json', 'X-Cockpit-Schema': '4' },
  });
  if (url.includes('/api/render')) {
    const rel = decodeURIComponent((url.split('path=')[1] || '').split('&')[0]);
    return json(RENDERED[rel] || { metadata_html: '', html: '<p>(not in fixtures)</p>' });
  }
  if (url.includes('/api/cockpit/review-queue')) return json(REVIEW_QUEUE);
  if (url.includes('/api/cockpit/review/')) {
    const key = url.split('/api/cockpit/review/')[1].split('?')[0];
    return json(REVIEW_DETAIL[key] || REVIEW_DETAIL._default);
  }
  if (url.includes('/api/cockpit/scope-tests')) return json(SCOPE_TESTS);
  if (url.includes('/api/notes/')) return json({ ok: true, result: {} });
  if (url.includes('/api/cockpit/review-resolve')) return json({ ok: true });
  if (url.includes('/api/cockpit/stats'))    return json(STATS);
  if (url.includes('/api/cockpit/commits'))  return json(COMMITS);
  if (url.includes('mode=library'))          return json(NAV_LIBRARY);
  if (url.includes('/api/cockpit/nav'))      return json(NAV_EMPTY);
  if (url.includes('/api/cockpit/context'))  return json({ schema_version: 4, platform: 'all', linked: [], backlinks: [] });
  if (url.includes('/api/cockpit/state'))    return json({ schema_version: 4 });
  if (url.includes('/api/cockpit/actions'))  return json({ actions: [] });
  if (url.includes('/api/cockpit/validation')) return json({ schema_version: 4, ok: true, state: 'ok', errors: [], warnings: [] });
  if (url.includes('/api/cockpit/dispatch-requests')) return json({ requests: [] });
  if (url.includes('/api/cockpit/sessions')) return json({ sessions: [] });
  if (url.includes('/_events')) return new Response('', { status: 200 });
  return realFetch(input, init);
};
class FakeES { constructor() { this.readyState = 1; } addEventListener() {} close() {} }
window.EventSource = FakeES;

// The renderer reads the active workspace's sidecar URL from IPC events;

try {

} catch {}
