      severity: low
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      note: "KEEP: a number that leads nowhere should not be dressed as a control. Asked where the pill took him the answer was nowhere; making it navigate revealed that clicking the ROW already opens the phase. Now inline after `in flight`, same font, amber. Also: `needs you` is the AGENT-state vocabulary (needs-input formats to it) — the page's own legend said `attention` all along. And the DES-0004 guard asserted the WIDGET (ov-phase-pill is-waiting) rather than the fact it protects."
    ISS-0101:
      file: "docs/issues/ISS-0101-Four-State-Fields-One-Counted-Twice.md"
      title: "The phase row carried four state fields and counted some items twice, and a feature's own status rendered after the squares describing its children"
      status: fixed
      severity: medium
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      note: "KEEP: alignment makes a row readable, it cannot make it meaningful. `15 waiting` was an aggregate and three columns later the SAME row itemised 2 triage · 1 in review — members of the set it had just totalled. Collapsed 4 state fields to 3: own status | 24/51 · 47% · 10 in flight | 20 needs you (breakdown in the tooltip). Also: a feature's chip now precedes the fraction and squares, which describe its CHILDREN. And a merged field needs its column token re-measured — at the old 96px the progress text ran under the pill beside it."
    ISS-0100:
      file: "docs/issues/ISS-0100-Rows-Are-Flex-Chains-Not-Columns.md"
      title: "Overview rows are flex chains, so every field sits wherever the one before it ended — nothing lines up down a column, and a 260px name column wastes 873px of row"
      status: fixed
      severity: medium
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      note: "KEEP: three properties make a list scannable and this phase found them one at a time — fields separated (ISS-0097), rows the same height (ISS-0098), fields at the same x (ISS-0100). Two grid lessons: columns must be ASSIGNED not inferred (auto-placement filled the first free cell, so a row lacking a pill slid its meta into the pill's column); and ONE flexible column per row, not two (a 1fr title with an auto last column computed 518/593/701px across three rows). Also: .scoped-feat had THREE rule blocks, so the guard read the wrong one twice — merged, and the guard now requires exactly one."
    ISS-0099:
      file: "docs/issues/ISS-0099-Change-Ids-Unshortened-In-The-Activity-Feed.md"
      title: "The activity feed renders a change note's full slug id, which wraps to four lines and breaks the row rhythm — ISS-0084's shortening never reached this surface"
      status: fixed
      severity: low
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      note: "The FOURTH surface ISS-0084's shortening has had to reach. The finding is as much that the transform lives in a helper every renderer must remember to call — the guard should enumerate id-rendering sites, not name the known ones."
    ISS-0098:
      file: "docs/issues/ISS-0098-The-Squares-Strip-Collapses-To-A-Column.md"
      title: "A feature's task squares wrap into a one-square-wide column when the row is tight, blowing one row to 116px against its neighbours' 32"
      status: fixed
      severity: medium
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      note: "Measured on your-health PHASE-0010: heights 32..116, FEAT-0071's strip 9px wide by 105px tall with 9 squares. Not a squares bug — the ROW has no column model, so the most compressible child absorbs every shortfall, and a 3px square is the most compressible thing there is."
    ISS-0097:
      file: "docs/issues/ISS-0097-Scoped-List-Rows-Have-No-Layout.md"
      title: "The scoped overview's Verification and Remaining rows have no layout, so the id, the title and the meta render as one run-on string"
      status: fixed
      severity: medium
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      note: "TST-0005GET /api/render...guardauto · ran... — neither .ov-waiting-list li nor .verification-list li declares flex or gap in either stylesheet. The layout was INTENDED: .verification-meta carries margin-left:auto, which silently does nothing outside a flex row."
    ISS-0096:
      file: "docs/issues/ISS-0096-No-Surface-Says-What-Changed.md"
      title: "No surface answers what a piece of work actually changed, so acceptance has the notes and the app but never the diff between them"
      status: fixed
      severity: medium
      phase: "[[PHASE-024-Acceptance-Witnessed]]"
      note: "Not read-the-code: for a docs-first reader the question is did this touch what it claims to. A task promising a CSS fix that rewrote the validator is one line of shape, and invisible in prose."
    ISS-0095:
      file: "docs/issues/ISS-0095-The-Agent-Roster-Is-Hard-Coded.md"
      title: "The dispatchable agent roster is a hard-coded pair, so a standing worker outlives neither a vendor change nor a second opinion"
      status: fixed
      severity: low
      phase: "[[PHASE-027-The-Standing-Worker]]"
      note: "ADR-0009 said the principal is a role; the WORKER is a role too. One vendor as a single point of failure, and it forecloses the second-opinion runs ADR-0013 already blesses."
    ISS-0094:
      file: "docs/issues/ISS-0094-Permission-Prompts-Are-Detected-But-Not-Answerable.md"
      title: "An agent's permission prompt is detected but not answerable, so the one thing most likely to stall an unattended worker sits outside the queue the stall alarm watches"
      status: fixed
      severity: high
      phase: "[[PHASE-027-The-Standing-Worker]]"
      note: "THE find of the t3.codes round. FEAT-0076's invariant — nothing waits silently without bound — watches the review QUEUE; a tool-permission prompt is not a queue entry, so the likeliest way an unattended worker stalls is the way the alarm cannot see. A defect in something already designed, not a new want."
    ISS-0093:
      file: "docs/issues/ISS-0093-Nested-Padding-And-Two-Heading-Styles.md"
      title: "Three nested paddings pushed a phase id further right than the features beneath it, and a second section-heading style was written without checking the first existed"
      status: fixed
      severity: low
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "A parent indented further than its children is the one arrangement a tree must never produce. No single value was wrong — band 6 + group 2 + head 8 compounded. The BODY carries the indent, not the group: indenting the group moves the head too, and the head is what is being indented from. Also KEEP: assert the mutation applied, not just that the guard passed — one reported green here while silently failing to match."
    ISS-0092:
      file: "docs/issues/ISS-0092-Severity-Buckets-Straddled-The-Completed-Split.md"
      title: "A severity bucket holding both open and fixed issues had to be placed whole, so one open issue could keep fifty-six fixed ones above the completed divider"
      status: fixed
      severity: medium
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "One open medium issue would have kept 56 fixed ones above the divider under a card headed Medium · 57. Invisible in this corpus because every issue is fixed — homogeneous by accident. Split on completion BEFORE severity and every bucket is homogeneous, so the existing live/completed rule places both halves without knowing about severity. Also: one border per object — the band is a card, its children are not; ISS-0088's opposite rule held only where the children were framed."
    ISS-0091:
      file: "docs/issues/ISS-0091-Two-Handles-And-A-Shrinking-Id.md"
      title: "Two levels of one tree drew different expand handles, and a group head's id shrank to 7px because flex:none was scoped to rows"
      status: fixed
      severity: low
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "flex:none was scoped to .nav-item-line, so in a HEAD the id was a flexible child of an overflow-hidden container — PHASE-007 rendered 7px of 62. A flex container cannot ellipsise its children; the ellipsis belongs on the name. And there were THREE declarations of one expand triangle, two identical by coincidence: .ov-chev had it since FEAT-0043, group heads kept an older caret, and I reinvented it at ISS-0088 rather than reusing it."
    ISS-0090:
      file: "docs/issues/ISS-0090-Phase-Rows-And-The-Missing-Id-Column.md"
      title: "Phase rows still differ from the overview's, and a plan's empty id drops it out of the id column so it sits 78px left of its sibling requirements"
      status: fixed
      severity: low
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "KEEP: a column is only a column if every cell in it is the same width, including the ones standing in for something absent. A plan carries id:\"\" deliberately, the renderer skipped the span, and its title sat 78px left of its siblings. Closing it took three passes — a handle, a min-width, then removing the handle's smaller font, because ch is relative to the font."
    ISS-0089:
      file: "docs/issues/ISS-0089-A-Card-Head-Names-A-Category-Not-A-Thing.md"
      title: "Copying the context card's head styling made phase names render as labels — a card head names a category, a phase head names a thing, and only one of those can be faint"
      status: fixed
      severity: medium
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "KEEP: the right pane's head names a CATEGORY, the features navigator's names a THING. TASKS is scaffolding you read past, so faint/small/uppercase is right and four frames read as structure; PHASE-007 · Agent instrumentation IS the content, and eighteen frames read as clutter. Four rounds were spent making them match. Also: the pill was wrong twice in opposite directions — suppressed by a rule whose output looked random, then unconditional so a card called Done carried a done pill. The question is whether the NAME already says it, which is the same question the divider and the summary ask."
    ISS-0088:
      file: "docs/issues/ISS-0088-The-Card-Is-A-Style-Not-Just-A-Behaviour.md"
      title: "The completed sections behave like the right pane's cards but do not look like them, and the group heads carry an icon, an uncoloured id and an inconsistent pill"
      status: fixed
      severity: medium
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "FEAT-0058 gave the navigators the right pane's BEHAVIOUR and none of its LOOK. Keep beyond this phase: TASK-0272 suppressed a group's status chip when the summary already ended in that word, so PHASE-001 had no pill and PHASE-002 did — defensible rule, arbitrary-looking output. A reader only ever sees the output. Review desk deliberately left alone: its sections are kinds of obligation, not collections, and a card invites collapsing the thing you always want to see."
    ISS-0087:
      file: "docs/issues/ISS-0087-Nav-Group-Headers-Are-Twice-The-Height-They-Copy.md"
      title: "The navigator's group headers are twice the height of the context cards they were aligned to, because only their type was matched and not their padding"
      status: fixed
      severity: low
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "FEAT-0057 matched the two panes' TYPE — 11px/600/uppercase, identical already — and stopped. Density is set by the BOX: 42px against 22px, nineteen headers over, plus a background and border the right pane has not. Now 25px. Fifth correction in a row with one cause: verifying the thing changed instead of the surface it lives on."
    ISS-0086:
      file: "docs/issues/ISS-0086-The-Rollup-Hid-The-Taxonomy.md"
      title: "The roll-up collapsed the phase list, the status vocabulary and the severity ladder into one line — structure, not noise, and the overview never made that mistake"
      status: fixed
      severity: medium
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "Quantity lives in a group's BODY, structure lives in its HEAD — TASK-0273 applied one rule to both, so the features navigator's whole top level became two rows. The overview's scope pane has had this right since FEAT-0043: Completed · N as a HEADING with every phase still named. Both panes now use that band and that wording. Alignment ran both ways — the overview gained the ID column it never had, and lost a max-width:55% truncating 13 of 24 rows with 200px unused."
    ISS-0085:
      file: "docs/issues/ISS-0085-One-Line-Grammar-Reached-One-Of-Four-Renderers.md"
      title: "The one-line grammar reached one of the left pane's four row renderers, and the subtitle put a second line back on that one"
      status: fixed
      severity: medium
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "The left pane has FOUR renderers and pickItemRenderer routes per group; TASK-0271 rewrote one. I wrote the task against navItem, checked navItem, and wrote the guard against navItem — a guard written from the same reading as the change confirms the reading, not the behaviour. One shared buildNavRow now, asserted over every renderer the picker can return."
    ISS-0084:
      file: "docs/issues/ISS-0084-Change-Ids-Print-Their-Description-Twice.md"
      title: "A change note's id is its description, so a row renders the description twice and the CHG slug is the widest thing in the pane"
      status: fixed
      severity: low
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "Edwin spotted it. CHG-YYYYMMDD-Short-Description (LIFECYCLE.md line 95) means a change's id IS prose, at five times the width of every other id. Free while the id had its own line; expensive the moment TASK-0271 put id and title on one — a layout change made an existing inconsistency costly. Display-only fix; id: stays canonical."
    ISS-0083:
      file: "docs/issues/ISS-0083-Active-Nav-Row-Never-Highlights.md"
      title: "The navigator never highlights the open note, because refreshActiveNavRow selects li.nav-item while the class sits on the inner div"
      status: fixed
      severity: medium
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "Pre-existing and silent: measured at f5e6637, 112 rows carrying data-rel and is-active on zero of them. Surfaced only because TASK-0273's roll-up needs the active row to open the group holding it, turning a decorative no-op into a functional one."
    ISS-0082:
      file: "docs/issues/ISS-0082-Phantom-Phase-Group-From-The-016-Merge.md"
      title: "Two code paths read the phase link differently, so renaming PHASE-016 during the merge forked its children into a phantom group in the features navigator while the overview showed them correctly"
      status: fixed
      severity: medium
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      note: "Mine, from the ISS-0077 merge. _phase_id_of extracts PHASE-016 and resolves; _phase_target keeps the whole slug and does not — so the overview was right and the navigator was wrong. A phase's identity is its ID, not its title."
    ISS-0081:
      file: "docs/issues/ISS-0081-Right-Click-Selected-A-Word-And-Clobbered-The-Clipboard.md"
      title: "xterm's right-click word-select combined with unconditional copy-on-select to overwrite the clipboard with the word under the cursor, so right-click-to-paste pasted that word back"
      status: fixed
      severity: medium
      phase: "[[PHASE-020-Clipboard-That-Works]]"
      note: "Introduced by ISS-0080: copy-on-select was opt-in and off, so xterm's rightClickSelectsWord (on by default on macOS) was harmless. Turning copy-on-select on made a dormant default load-bearing — a default that was never wrong before is not a default that was checked."
    ISS-0080:
      file: "docs/issues/ISS-0080-Console-Context-Menu-Replaced-By-Terminal-Convention.md"
      title: "The console's context menu does not work for the user across three attempts — replace it with the terminal convention (select copies, right-click pastes) rather than debug a menu a console does not need"
      status: fixed
      severity: medium
      phase: "[[PHASE-020-Clipboard-That-Works]]"
      note: "Three reports it does not work while Cmd-C/V do; three rounds of instrumentation say the menu path writes to the PTY and focus is held. When the measurement and the user disagree three times the measurement is answering a different question. Edwin's proposal removes the mechanism rather than repairing it. Restart console lives ONLY in that menu and must be rehomed."
    ISS-0079:
      file: "docs/issues/ISS-0079-Context-Menu-Only-Ever-Fired-For-Anchors.md"
      title: "The note context menu keyed off `closest('a')`, so every button-shaped row — History, the uncommitted band — got the word menu and no way to copy anything about the note it names"
      status: fixed
      severity: medium
      phase: "[[PHASE-020-Clipboard-That-Works]]"
      note: "TASK-0262 fixed the anchor path and was verified on an anchor. History rows are BUTTONs, so a right-click on a feature there still got the word menu — the symptom FEAT-0054 was raised for, on a surface it never covered."
    ISS-0078:
      file: "docs/issues/ISS-0078-Downstream-Pilot-Was-Overtaken-And-CLAUDE-Md-Still-Claims-It.md"
      title: "PHASE-003's downstream pilot was overtaken by workspace discovery and never built, while CLAUDE.md still tells every session the shim exists"
      status: fixed
      severity: medium
      phase: "[[PHASE-015-Phase-Hygiene]]"
      note: "The shim was never built and is now near-worthless (its job is one command). The pattern it would have proven is in daily use across 12 repos via workspace discovery. ADR-0003, which the phase gates on, was never written and its number was taken. CLAUDE.md has been pointing every session at an integration point that does not exist."
    ISS-0077:
      file: "docs/issues/ISS-0077-Phase-Granularity-Collapsed-To-One-Per-Request.md"
      title: "Nine phases opened in one day against nine in the preceding twelve weeks — a phase became the unit of a request rather than of a delivery push, at a fifth of the historical size"
      status: fixed
      severity: medium
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      note: "Nine phases opened 2026-07-30 against nine in the preceding twelve weeks; median 4 items vs 21. Cause: the document-first rule needs a focus item and an open phase is the cheapest way to get one, so every request minted one. PHASE-011/012/013 were planned together and are fine; 014-019 were reactive."
    ISS-0076:
      file: "docs/issues/ISS-0076-Phase-Rows-Do-Not-Show-Their-Phase-Id.md"
      title: "The overview's Phases section shows each phase's title and never its ID, so the one place that lists every phase cannot be cross-referenced with anything that names them"
      status: fixed
      severity: low
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      note: "buildPhaseRow already holds the id in p.key — it routes the title click with it — and never renders it. Everything that refers to a phase refers to it by ID, so the one surface listing every phase is the only one that cannot be cross-referenced."
    ISS-0075:
      file: "docs/issues/ISS-0075-Busiest-Grid-Cells-Render-Smallest.md"
      title: "The contribution grid's busiest days render 33% smaller than its quietest — the 'second channel' was subtractive, so the strongest signal was the weakest mark"
      status: fixed
      severity: medium
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      note: "An inset box-shadow in the BACKGROUND colour eats into the cell, so step 4 shows 6px of colour against step 1's 9px. Cited DES-0004 to justify it, but that rule is about HUE — lightness is already greyscale- and CVD-safe, which is why GitHub's scale works. Solved a problem that did not exist, subtractively."
    ISS-0074:
      file: "docs/issues/ISS-0074-Sixteen-Delivered-Notes-Stranded-In-The-Parking-Lot.md"
      title: "16 of the 19 notes naming PHASE-999 are terminal, so the phase strip draws 16 `delivered` squares inside a phase titled 'Future / Unphased'"
      status: fixed
      severity: medium
      phase: "[[PHASE-015-Phase-Hygiene]]"
      note: "Edwin's question, measured. The rule is upstream (project-os-dev ISS-0027, the mirror of PHASE-CHILDREN); this is the local corpus correction plus a guard so it cannot silently refill."
    ISS-0073:
      file: "docs/issues/ISS-0073-Swift-Unit-Interval-Colours-Read-As-Unresolved.md"
      title: "SwiftUI's 0–1 Color(red:green:blue:) reads as unresolved, so a real colour renders as a source expression"
      status: fixed
      severity: low
      phase: "[[PHASE-013-Fleet-Surfaces]]"
      note: "Found verifying TASK-0231. The unresolved path is for colours with no honest hex; using it for a fully-specified one teaches readers to skim past the ones that matter."
    ISS-0072:
      file: "docs/issues/ISS-0072-Snapshot-Edits-Do-Not-Retrigger-Validation.md"
      title: "The validator never re-runs on a SNAPSHOT.yaml edit — its dedicated project-root observer does not fire, so METRICS drift never clears live"
      status: fixed
      severity: medium
      phase: "[[PHASE-013-Fleet-Surfaces]]"
      note: "Found during TASK-0250's live pass and fixed: FSEvents is case-SENSITIVE on a case-INsensitive filesystem, so a watch registered as /Users/edwin/... never matched events reported as /Users/Edwin/.... The recursive docs watcher matched by prefix and was unaffected; only the exact-match SNAPSHOT watch broke, on every app-spawned sidecar. The docs-tree watcher path works; the project-root SNAPSHOT observer does not fire at all (three edits, no re-run). METRICS is the commonest error and lives in SNAPSHOT.yaml, so the likeliest way to go red is the one way you cannot see yourself go green. FEAT-0018's acceptance was verified with a docs-tree fault, which takes the working path."
    ISS-0069:
      file: "docs/issues/ISS-0069-Review-Verdict-Vocabulary-Is-Unguarded.md"
      title: "review_verdict has a second, unguarded vocabulary — 10 notes carry `CLOSE`, which QUALITY.md does not define, and nothing rejects it"
      status: fixed
      severity: medium
      phase: "[[PHASE-011-Unproven-Claims]]"
      note: "Corpus holds approved 65, CLOSE 10, accepted 2. `accepted` is legitimate (ADR-0007, plan acceptance). CLOSE is undefined and all 10 are CHG notes from a three-day window. The validator checks presence, not value, so an arbitrary string reads as a satisfied review — ISS-0024 §1 one level up, in the review fields rather than the status fields. Found by FEAT-0018's visual pass rendering the chip grey; the surface caught what the validator could not. Deliberately not fixed in the same pass: rewriting 10 verdicts is a decision about whether past reviews happened."
    ISS-0068:
      file: "docs/issues/ISS-0068-Waiting-On-You-Is-A-Workaround.md"
      title: "The overview's Waiting-on-you list re-lists items that are already on the page as phase squares — it exists because the squares cannot say anything needs a human, and most of its rows duplicate a mode that owns them"
      status: fixed
      severity: medium
      phase: "[[PHASE-012-Attention-In-The-Strip]]"
      note: "Measured: all 9 rows already had a square on the page (384 squares, 8 of 9 visible), every one bucket=backlog. The squares carry two visual states plus type colour, so blocked/triage/open/review/deferred/backlog are pixel-identical — the list is prose compensating for one missing bit. DES-0004 proposes four treatments. A counts-and-pointers version was rejected: the stat tiles already are that indication. Deleting it reverses TASK-0200, TASK-0210 and DES-0001 plate 5, so those want superseding rather than emptying."
    ISS-0067:
      file: "docs/issues/ISS-0067-Untyped-Task-Notes-Are-Unreachable.md"
      title: "Three task notes carry no frontmatter and reach no surface — ISS-0062's mechanism, surviving for the task type because the fix was applied to plans only"
      status: fixed
      severity: low
      phase: "[[PHASE-012-Attention-In-The-Strip]]"
      note: "TASK-0182/0183/0187: 247 task files on disk, 244 typed. Found in review round four by sweeping notes rather than types — a per-type count never surfaces it, because 244 is not suspicious. REQ-0025 is about types and passed correctly; this is the residue a type-level guarantee does not cover."
    ISS-0066:
      file: "docs/issues/ISS-0066-Test-Coverage-Registers-Drift-By-Hand.md"
      title: "A TST note's ## Coverage list is a hand-maintained register of its own assertions, and drift in it is indistinguishable from a false claim — TST-0022 took four review rounds to describe 27 assertions accurately"
      status: fixed
      severity: medium
      phase: "[[PHASE-011-Unproven-Claims]]"
      note: "Four independent-review rounds on TST-0022, four findings, all one class: the register claiming more, less or other than the tests deliver. Two entries stayed missing for three rounds while being cited by name in REQ-0025's criteria. Same shape ADR-0009 and ADR-0010 already settled elsewhere — a hand-written second copy of machine-readable truth — except here the copy is cited as evidence, so drift reads as a false verification claim. Parked in PHASE-999, not PHASE-010: the phase is done; the format gap it exposed is not the phase's work."
    ISS-0064:
      file: "docs/issues/ISS-0064-Two-Reviewed-Sections.md"
      title: "The review desk shows two sections headed 'Reviewed' with different counts, and the registers sit in the wrong order"
      status: fixed
      severity: medium
      phase: "[[PHASE-010-Surface-Ownership]]"
      parent: "FEAT-0049"
      note: "Found by Edwin looking at the pane, minutes after PHASE-010 closed. TASK-0242 took the word 'Reviewed' for its register without noticing the ADR-0007 tally already used it — 'Reviewed · 1' above 'Reviewed · 62', counting different populations. TST-0022 step 5 checked both registers existed and was blind to naming and order, because it was derived from a reachability requirement."
    ISS-0062:
      file: "docs/issues/ISS-0062-Most-Plans-Are-Invisible.md"
      title: "19 of 33 plans are invisible in the cockpit — the Library group shows only the typed ones"
      status: fixed
      severity: medium
      phase: "[[PHASE-010-Surface-Ownership]]"
      parent: "FEAT-0046"
      note: "Type-based lookup returns 14 convincing rows out of 33. The other 19 carry no frontmatter, and features/ is excluded from the Docs tree, so they are unreachable everywhere. Fixed by reading the path, not by retyping the files."
    ISS-0063:
      file: "docs/issues/ISS-0063-Dead-Stat-Tiles.md"
      title: "The Risks and Tests stat tiles are dead ends — they look clickable and navigate nowhere"
      status: fixed
      severity: low
      phase: "[[PHASE-010-Surface-Ownership]]"
      parent: "FEAT-0047"
      note: "buildStatTile renders a button only when passed a navMode; Reqs, Tests and Risks are passed none. Reqs stays dead deliberately — it has no single destination."
    ISS-0032:
      file: "docs/issues/ISS-0032-Dispatch-Agent-Vocabulary-Is-Closed-To-Two.md"
      title: "The dispatch agent vocabulary is a closed two-value union restated across nine sites; a third agent is dropped from the persisted queue and coerced in two preference paths"
      status: fixed
      severity: medium
      phase: "[[PHASE-007-Agent-Instrumentation]]"
      note: "Found while designing external review (project-os-dev FEAT-0018). Blocks adding Kimi as a dispatch target — a third value is silently misattributed to Claude in session records."
  requirements:
    REQ-0033:
      file: "docs/requirements/REQ-0033-Every-Project-Can-Say-What-It-Is.md"
      title: "Every project can say what it is — the standing documents are declared as data, singular by construction, extensible without code, and their freshness is reported"
      status: implemented
      phase: "[[PHASE-030-Obligations-Go-Home]]"
      specifies: ["FEAT-0091"]
      note: "The two-layer manifest exists because of the SYNC, not for elegance: sync-project-os.sh overwrites tools/instructions, tools/skills, docs/__templates__ and docs/__bases__ wholesale, so a project addition living there is destroyed on the next sync. SNAPSHOT.yaml is never synced, which is what makes it the right half for extensions."
    REQ-0032:
