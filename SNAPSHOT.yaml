      issues: ["ISS-0126"]
      risks: ["RISK-0005"]
      note: "REL-0001 leg 2, second. 5 of 25 children unresolved — the nearest phase to closing. GATED on ISS-0126 (does FEAT-0062 survive ADR-0020, since it builds two verbs onto the retired desk): a DECISION, not work, and it may remove the feature entirely. RISK-0005 (write surface on a LAN-visible server) is now live rather than anticipated — the endpoints shipped in leg 1 — and an open risk does not resolve by its phase closing."
    PHASE-024:
