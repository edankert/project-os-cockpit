  derive_fields: true      # title/goal derived from the note
  prune_window: 25         # keep N most recent terminal items per collection
  note: "2026-08-11: IMPLEMENTATION BRIEF for REL-0001, LEG 2 (docs/releases/REL-0001-The-Human-Has-Levers.md). The release was re-scoped by Edwin: it is now defined by PHASE-023/024/025/026/027 all reaching `done`, not by a feature list. PHASE-028 and PHASE-029 are deferred by decision. Leg 1 — 11 features, done 2026-08-10 — is closed; do not reopen it. See focus.note for the full order and the measured bar. The short version: ISS-0126 is step 0 and is a DECISION; then PHASE-026 (FEAT-0072 release surface FIRST), PHASE-023 close-out, PHASE-024 (FEAT-0063 runner first), PHASE-025 (parallel-capable, no gates), PHASE-027 LAST. Notes are the spec; do not widen scope. Every write path stays behind REQ-0026/REQ-0027."

docs_system:
  source_of_truth: SNAPSHOT.yaml
  instructions:
    - tools/instructions/OBSIDIAN.md
    - tools/instructions/LIFECYCLE.md
  references:
    - docs/PHASES.md

