    ADR-0007:
      title: "Approval gate for planning artifacts — advisory first, measured before gating"
      status: accepted
      path: "docs/decisions/ADR-0007-Planning-Artifact-Approval-Gate.md"
      note: "Gating question SETTLED 2026-07-29: stay advisory, permanently. Not because review rubber-stamps but because the flow the gate would govern does not occur — the gate would have covered 1 of 62 review events (corrected 2026-07-30 from '1 of 63'; the sets overlap by one), because review here happens at close-out (QUALITY.md), not before implementation. Independent review upheld the decision and narrowed the ratio to ~17:1 on comparable windows. The measurement obligation is discharged and the tally surface removed (TASK-0247); ReviewStore keeps recording outcomes for any future revisit, though the count itself lives in gitignored .cockpit/ and is not reconstructible from the repo."

