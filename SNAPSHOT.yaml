    FEAT-0056:
      file: "docs/features/completed-work/FEAT-0056-Completed-Work-Ordering.md"
      title: "Open work sorts first, long lists fold, and the context pane never filters — so a corpus that is 99% complete reads without a switch that empties it"
      status: done
      phase: "[[PHASE-022-Completed-Work-Gets-Quieter]]"
      tasks: [TASK-0267, TASK-0268, TASK-0269, TASK-0270]
      note: "At 99% lifecycle completion a state filter is not a filter. Each view groups on a different axis — status, severity, phase, type — and state is orthogonal to all four, which is why a global switch got invented instead of ordering."
    FEAT-0055:
      file: "docs/features/git-assist/FEAT-0055-Git-Assist.md"
      title: "Close-out commits its own work, and being behind a remote is visible"
      status: done
      phase: "[[PHASE-021-Git-Is-Not-The-Users-Job]]"
      tasks: [TASK-0264, TASK-0265, TASK-0266]
      note: "Assisted, not automatic (Edwin). The push does not fail because it is hard — it fails because it is invisible: 312 commits and six days behind across eight repos on 2026-07-30, with nothing anywhere mentioning it. A commit is local and reversible; a push is publishing."
    FEAT-0054:
      file: "docs/features/clipboard/FEAT-0054-Clipboard-That-Works.md"
      title: "One clipboard path, a link-aware context menu, and no silent failures"
      status: done
      phase: "[[PHASE-020-Clipboard-That-Works]]"
      tasks: [TASK-0261, TASK-0262, TASK-0263]
      note: "Edwin reported it; both halves reproduced. Two clipboard stacks (Electron roles in the doc pane, navigator.clipboard in the terminal) with different failure modes; the context menu ignores params.linkURL; and the right-click clears xterm's selection before the menu asks whether one exists, so Copy is disabled exactly when you need it."
    FEAT-0053:
      file: "docs/features/history-navigation/FEAT-0053-History-Navigation.md"
      title: "A contribution grid you can click into, and a permanent way to reach History"
      status: done
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      tasks: [TASK-0258, TASK-0259, TASK-0260]
      note: "Edwin, right after FEAT-0052 landed. A literal GitHub grid would look broken here — measured 16 active days in 12 weeks, median 34 transitions, so fixed buckets saturate every lit cell. Three corrections: relative intensity, absent-is-not-empty, no year controls without a second year."
    FEAT-0052:
      file: "docs/features/history-timeline/FEAT-0052-History-Timeline.md"
      title: "History — document state changes as the rows, commits as dividers"
      status: done
      phase: "[[PHASE-016-The-Overview-Answers-Questions]]"
      tasks: [TASK-0255, TASK-0256, TASK-0257]
      note: "Edwin's framing: the docs are a layer over git so you need not read git. Rows are status TRANSITIONS, not note touches — measured, the phase-hygiene commit touched 20 notes and changed 4 statuses. Commits become dividers marking what is saved. Replaces three overview tiles with one."
    FEAT-0051:
