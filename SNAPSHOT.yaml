      issues: ["ISS-0096"]
      note: "REL-0001 leg 2, third. 19 of 20 children unresolved. FEAT-0063 (the runner) FIRST: it closes a door-to-nothing leg 1 CREATED — FEAT-0088 marks a feature `acceptance: requested` and offers no way to run it — and it is what makes the Tier 1/2/3 gate real rather than notional. REQ-0028 advances to `implemented` at feature close-out, not independently."
    PHASE-025:
      file: "docs/phases/PHASE-025-Design-Before-Code.md"
      title: "Design before code — the bench renders what a design proposes, measures it against what exists, and holds implementation to what was accepted"
      status: done
      order: 25
      features: ["FEAT-0067", "FEAT-0068", "FEAT-0069", "FEAT-0070"]
      note: "REL-0001 leg 2, fourth by queue position but genuinely PARALLEL: the only phase in the release with no issues, no risks, no requirements and no external gate. 16 of 17 children unresolved, all of them features and tasks. Use it whenever something else blocks rather than waiting for its turn."
    PHASE-027:
      file: "docs/phases/PHASE-027-The-Standing-Worker.md"
      title: "The standing worker — a project runs without its human in the daily loop: work selected and closed by a worker, judgments delegated under recorded policy, exceptions that escalate instead of stall"
      status: done
      order: 27
      features: ["FEAT-0074", "FEAT-0075", "FEAT-0076", "FEAT-0077", "FEAT-0078"]
      issues: ["ISS-0094", "ISS-0095"]
      risks: ["RISK-0006"]
      note: "REL-0001 leg 2, LAST and it earns it — 28 of 28 children unresolved. Opens with APPROVAL work, not build work: REQ-0029/0030/0031 are all `draft` and DES-0009 is `draft`. RISK-0006 (compounding wrong judgment at machine speed) must be mitigated before an unattended loop runs at all. HARD ORDERING: after PHASE-024 — the worker delegates acceptance, so acceptance must exist and be recorded before anything is delegated to a machine. FEAT-0078 was missing from REL-0001's deferred table; it is the fifth feature here."
