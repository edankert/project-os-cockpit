focus:
  task: "TASK-0315"
  feature: "FEAT-0072"
  phase: "PHASE-026"
  issue: "ISS-0141"
  note: "2026-08-12: REL-0001 IS SHIPPED (released, 1.0.0, tag v1.0.0, local and never pushed) and the work since is Edwin USING it. Six observations from use, all addressed (CHG-20260811-Six-From-Use): the status toast now dismisses itself (78 of 110 call sites never did), Caught up clears its band, ADR-0023 retired the change-note review obligation (badge 87 -> 0), FEAT-0092 gave Features/Issues/Tests landing pages that lead with what their badge counts, Intent stopped listing all eight standing documents twice, and the template workflow stubs left docs/. THE UPSTREAM PASS LANDED 2026-08-12 and found ADR-0011 EXISTS: all 18 upstream ADRs live in project-os-dev, which no citation names — see ISS-0123. ADR-0019 there, QUALITY.md + REVIEW_SETTLED_STATUSES in project-os, taken down here. FEAT-0093 + ADR-0024 then built the notation: `[[project-os-dev#ADR-0011]]` renders as a link and the cockpit switches workspace and opens it. `#` not `/` because what follows is an id, not a path. project.id in SNAPSHOT.yaml defaults to the DIRECTORY NAME — project.name is a display string (spaces, and REPLACE ME in the template) and the workspace id is a sha1 of a path. OPEN AND EDWIN'S: ISS-0148 (sweep the 47 existing citations? one CONTEXT.md line covers them without rewriting any), and the upstream twin of ADR-0024 in project-os-dev + OBSIDIAN.md/TRACEABILITY.md. ALSO OPEN: RISK-0006 supervised week (PHASE-031), ADR-0022 proposed, PHASE-028/029 deferred, PHASE-030 active with its work done. Workflows: the three template stubs are gone from THIS repo only; 8 real project workflows in 3 repos stay and still render under Intent (verified 2026-08-12). Every write path stays behind REQ-0026/REQ-0027."
items:
