      status: done
      phase: "[[PHASE-030-Obligations-Go-Home]]"
      tasks: [TASK-0380, TASK-0381, TASK-0382, TASK-0383, TASK-0384]
      note: "Fleet-measured 2026-08-10: 90 of 96 standing documents present, 85 of 90 stale or undated (94%), 12 still template stubs. NOT a new type — a manifest, because there will never be a second glossary; but extensible per Edwin, so the base set is template-owned and projects extend via SNAPSHOT.yaml's `docs_system` block (which exists today and NOTHING reads). Singularity is enforced, not assumed. Status comes off; `updated:` carries meaning; staleness WARNS and never blocks. Removes ISS-0122's cause rather than re-bucketing its symptom."
