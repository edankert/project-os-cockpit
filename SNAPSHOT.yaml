      note: "REL-0001 leg 2, FIRST — not because it is largest but because FEAT-0072's release surface is what stops REL-0001 being hand-maintained, and that note already drifted (FEAT-0078 missing from its own deferred table). FEAT-0071 is done; 8 of 14 children unresolved, no issues/risks/requirements. TASK-0315 (UNRELEASED · N) then TASK-0316 (drafting becomes an action)."
    PHASE-023:
