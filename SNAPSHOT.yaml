  designs:
    DES-0004:
      file: "docs/designs/DES-0004-Attention-In-The-Squares.md"
      title: "Attention in the squares — retire Waiting-on-you by giving the phase strip the states it is missing"
      status: draft
      note: "role: proposal, viewport deliberately OMITTED (declaring it made the bench fit a tall document to the pane height and render at scale(0.66), presenting 9px squares at ~6px; omitted it is 1:1 at 1151px). Settled encoding after owner review: solid=delivered, solid+transparent slit=archived band (settled, nothing delivered), hollow+strike=deferred (parked, still blocks its parent), pulsing inverted fill=doing, static inverted fill=complete-but-unproven (22 waived items + 9 manual tests last verified 66-83 days ago, all rendering as clean solid squares today), corner dot=outstanding human action (triage/review/ready tests/computed-blocked). The dot composes with every fill because STATUSES.md allows blocked-while-doing. Requires a payload change: tests are not in the strip (50 feature/244 task/25 req/54 issue = 373); risks cannot join, none carry a phase. Records that blocked is a relationship not a status, so collectAttention's status==blocked branch is dead code."
    DES-0003:
      file: "docs/designs/DES-0003-Intent-Page-And-Claims-Board.md"
      title: "The intent page and the claims board"
      status: draft
      note: "role: proposal. The cockpit-side half of the 2026-07-29 design conversation; the upstream half is project-os-dev ADR-0014 (typed evidence) and ADR-0015 (parked hosted product). Deliberately has no asset: yet — see its own open question 4."
    DES-0002:
      file: "docs/designs/DES-0002-Cockpit-Design-System.md"
      title: "Cockpit design system"
      status: implemented
      note: "role: system. Values read from base.css/cockpit.css, not invented; records two real gaps (no spacing scale, no type scale) rather than papering over them. The living style-guide artifact is TASK-0221's output."
    DES-0001:
      file: "docs/designs/DES-0001-Overview-Redesign.md"
